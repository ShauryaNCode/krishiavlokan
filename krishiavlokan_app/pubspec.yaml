name: krishiavlokan
description: AI-powered crop failure analyzer for Indian farmers.
publish_to: 'none'
version: 1.0.0+1


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/advice/

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1


flutter_icons:
  android: true
  ios: true
  image_path: "assets/KrishiAvloakan_Logo.png"
